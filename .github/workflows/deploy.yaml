---
name: Deploy

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  chktex:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/latex/chktex@8182fab2382dfe610271fbb172cc53cbb549431f # v0

  vale:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/vale@8182fab2382dfe610271fbb172cc53cbb549431f # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vale-flags: --glob='!{config/,figures/*/example_,thesis}*'

  compile-latex:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/latex/compile@8182fab2382dfe610271fbb172cc53cbb549431f # v0

      - name: Upload artefacts
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artefacts
          path: |-
            *.bib
            *.bcf
            *.pdf
          if-no-files-found: error

  check-citations-referenced:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: compile-latex
    steps:
      - name: Download artefacts
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artefacts

      - name: Fix regex for checkcites
        # yamllint disable-line rule:line-length
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        id: references
        with:
          scheme: full
          run: >-
            sed -i 's#\sglob="false"##' thesis.bcf; echo uncited=$(checkcites -b
            biber thesis -u | grep -c "=>") >> $GITHUB_OUTPUT

      - name: Check all references cited
        if: ${{ steps.references.outputs.uncited > 0 }}
        # yamllint disable-line rule:line-length
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: core.setFailed('Not all references cited')

  upload-to-dropbox:
    if: github.ref == 'refs/heads/main'
    needs: compile-latex
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - name: Download artefacts
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artefacts

      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/dropbox@8182fab2382dfe610271fbb172cc53cbb549431f # v0
        env:
          CONFIGFILE_VERSION: ${{ secrets.CONFIGFILE_VERSION }}
          OAUTH_APP_KEY: ${{ secrets.OAUTH_APP_KEY }}
          OAUTH_APP_SECRET: ${{ secrets.OAUTH_APP_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        with:
          configfile-version: ${{ env.CONFIGFILE_VERSION }}
          files-to-upload: $(find . -maxdepth 1 -name '*.pdf' -print)
          oauth-app-key: ${{ env.OAUTH_APP_KEY }}
          oauth-app-secret: ${{ env.OAUTH_APP_SECRET }}
          oauth-refresh-token: ${{ env.OAUTH_REFRESH_TOKEN }}
