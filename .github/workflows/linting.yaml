---
name: Linting

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  linting:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/linting@2a7ba19ffbeb4ef996c2adb4f060d498981fb4f0 # v0
        with:
          pre-commit-config: ./.pre-commit-config.yaml
