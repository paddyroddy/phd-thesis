---
name: Links

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  links:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/links@8182fab2382dfe610271fbb172cc53cbb549431f # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
